services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ucl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucl}
      POSTGRES_DB: ${POSTGRES_DB:-ucl_analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ucl} -d ${POSTGRES_DB:-ucl_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Loads (or refreshes) the database. Runs once and exits.
  etl:
    build: .
    # Set ETL_ARGS=--offline to rebuild from data/raw without calling ESPN.
    command: python -m src.etl.run ${ETL_ARGS:-}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ucl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucl}
      POSTGRES_DB: ${POSTGRES_DB:-ucl_analytics}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: streamlit run app/Home.py --server.port 8501 --server.address 0.0.0.0
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ucl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucl}
      POSTGRES_DB: ${POSTGRES_DB:-ucl_analytics}
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully

volumes:
  pgdata:
