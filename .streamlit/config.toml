# Dark navy theme, loosely inspired by the Champions League's colours.
# Keep these in sync with SURFACE / PANEL in app/components/charts.py.
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0a0f2e"
secondaryBackgroundColor = "#111a45"
textColor = "#f3f5ff"
font = "sans serif"
headingFont = "Barlow Condensed:https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap"
baseRadius = "small"
borderColor = "#26306a"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#16204f"

[theme.sidebar]
backgroundColor = "#070b24"
secondaryBackgroundColor = "#111a45"
borderColor = "#1d2657"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
